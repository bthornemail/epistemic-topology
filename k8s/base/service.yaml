apiVersion: v1
kind: Service
metadata:
  name: danl-mcp-service
  namespace: epistemic-topology
  labels:
    app: danl-mcp
    component: service
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"  # For AWS
spec:
  type: ClusterIP
  selector:
    app: danl-mcp
    component: server
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800  # 3 hours
---
apiVersion: v1
kind: Service
metadata:
  name: danl-mcp-headless
  namespace: epistemic-topology
  labels:
    app: danl-mcp
    component: headless
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: danl-mcp
    component: server
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
