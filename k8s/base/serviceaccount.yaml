apiVersion: v1
kind: ServiceAccount
metadata:
  name: danl-mcp-sa
  namespace: epistemic-topology
  labels:
    app: danl-mcp
    component: serviceaccount
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: danl-mcp-role
  namespace: epistemic-topology
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: danl-mcp-rolebinding
  namespace: epistemic-topology
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: danl-mcp-role
subjects:
  - kind: ServiceAccount
    name: danl-mcp-sa
    namespace: epistemic-topology
