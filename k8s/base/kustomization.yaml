apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: epistemic-topology

commonLabels:
  project: epistemic-topology
  managed-by: kustomize

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - serviceaccount.yaml
  - persistentvolumeclaim.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml

images:
  - name: epistemic-topology/danl-mcp
    newTag: latest
