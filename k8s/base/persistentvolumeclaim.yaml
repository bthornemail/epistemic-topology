apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: danl-persistence-pvc
  namespace: epistemic-topology
  labels:
    app: danl-mcp
    component: storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard  # Change based on your cluster
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: scheme-code-pvc
  namespace: epistemic-topology
  labels:
    app: danl-mcp
    component: code
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 1Gi
  storageClassName: standard
