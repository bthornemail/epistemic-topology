# Default values for danl-mcp Helm chart

# Replica count
replicaCount: 3

# Image configuration
image:
  repository: epistemic-topology/danl-mcp
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# HD Addressing
hdAddress: "m/0x44414E4C'/0x00000001'/0'/0/0"
rpcEndpoint: "tcp://danl-mcp-service:3000/danl/base/0"

# DANL Configuration
danl:
  port: 3000
  host: "0.0.0.0"
  schemeInterpreter: guile
  schemePath: "/app/scheme/danl.scm"
  persistencePath: "/app/persistence/danl"
  maxConcurrentSimulations: 5
  simulationTimeout: 30000

# Service Account
serviceAccount:
  create: true
  annotations: {}
  name: "danl-mcp-sa"

# Pod annotations
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "3000"
  prometheus.io/path: "/metrics"

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001

# Container security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Service configuration
service:
  type: ClusterIP
  port: 3000
  targetPort: 3000
  annotations: {}
  sessionAffinity: ClientIP

# Ingress configuration
ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
  hosts:
    - host: danl.epistemic-topology.io
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: danl-mcp-tls
      hosts:
        - danl.epistemic-topology.io

# Resources
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

# Horizontal Pod Autoscaler
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Persistence
persistence:
  enabled: true
  storageClass: "standard"
  accessMode: ReadWriteOnce
  size: 10Gi
  annotations: {}

schemeCode:
  enabled: true
  storageClass: "standard"
  accessMode: ReadOnlyMany
  size: 1Gi

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - danl-mcp
          topologyKey: kubernetes.io/hostname

# Probes
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 0
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 30

# Environment variables
env: []

# Secrets
secrets:
  hdMasterSeed: "epistemic-topology-master-seed-change-in-production"
  apiKey: "dev-key-change-in-production"

# ConfigMap data
configMap:
  latticeSpec: |
    {
      "levels": [
        {"name": "bottom", "index": 0},
        {"name": "potential", "index": 1},
        {"name": "active", "index": 2},
        {"name": "confident", "index": 3},
        {"name": "top", "index": 4}
      ],
      "operations": {
        "join": {"symbol": "∨", "description": "Maximum"},
        "meet": {"symbol": "∧", "description": "Minimum"}
      }
    }
