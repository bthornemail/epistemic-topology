apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "danl-mcp.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "danl-mcp.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "danl-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "danl-mcp.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "danl-mcp.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.danl.port }}
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: DANL_PORT
              value: {{ .Values.danl.port | quote }}
            - name: DANL_HOST
              value: {{ .Values.danl.host | quote }}
            - name: SCHEME_INTERPRETER
              value: {{ .Values.danl.schemeInterpreter | quote }}
            - name: DANL_SCHEME_PATH
              value: {{ .Values.danl.schemePath | quote }}
            - name: DANL_PERSISTENCE_PATH
              value: {{ .Values.danl.persistencePath | quote }}
            - name: HD_MASTER_SEED
              valueFrom:
                secretKeyRef:
                  name: {{ include "danl-mcp.fullname" . }}-secrets
                  key: hdMasterSeed
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: danl-persistence
              mountPath: {{ .Values.danl.persistencePath }}
            - name: scheme-code
              mountPath: /app/scheme
              readOnly: true
            - name: config
              mountPath: /app/config/lattice.json
              subPath: lattice.json
              readOnly: true
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: danl-persistence
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "danl-mcp.fullname" . }}-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: scheme-code
          {{- if .Values.schemeCode.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "danl-mcp.fullname" . }}-scheme-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: config
          configMap:
            name: {{ include "danl-mcp.fullname" . }}-config
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
