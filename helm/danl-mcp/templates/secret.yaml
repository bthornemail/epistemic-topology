apiVersion: v1
kind: Secret
metadata:
  name: {{ include "danl-mcp.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "danl-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  hdMasterSeed: {{ .Values.secrets.hdMasterSeed | quote }}
  apiKey: {{ .Values.secrets.apiKey | quote }}
